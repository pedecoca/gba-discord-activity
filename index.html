<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <link rel="icon" type="image/svg+xml" href="./brand/gg-retro.svg">
  <title>GG Retro — Emulador no Discord</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080e;
      --surface: #0d101a;
      --surface-2: #121626;
      --line: #232941;
      --text: #f1f3ff;
      --muted: #8f98bd;
      --accent: #6d7cff;
      --accent-2: #a06bff;
      font: 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { overscroll-behavior: none; }
    body {
      margin: 0;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(900px 480px at 88% -12%, #3a2f7a55, transparent 62%),
        radial-gradient(700px 420px at -10% 115%, #0e3b5c5c, transparent 60%),
        var(--bg);
    }

    main {
      width: min(100% - 20px, 900px);
      height: 100dvh;
      margin: 0 auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    .app-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-header > div { min-width: 0; }

    h1 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      box-shadow: 0 8px 18px -8px #6d7cffcc;
    }

    .brand-name em {
      font-style: normal;
      color: #b9c3ff;
    }

    .brand-dot { color: var(--accent); }

    .subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .badge {
      flex: 0 0 auto;
      border: 1px solid #ffffff1a;
      background: #ffffff0a;
      color: #c9cff2;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .panel {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) auto;
      align-items: end;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }

    .field { display: grid; gap: 4px; min-width: 0; }

    label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
    }

    select {
      width: 100%;
      height: 38px;
      padding: 0 30px 0 10px;
      border: 1px solid #2a3150;
      border-radius: 9px;
      background-color: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #7d86ad 50%),
        linear-gradient(135deg, #7d86ad 50%, transparent 50%);
      background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    select:disabled { opacity: 0.55; }
    select:focus-visible, button:focus-visible, .gba-control:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .panel-actions { display: flex; gap: 8px; }

    button {
      font: inherit;
      font-size: 0.84rem;
      font-weight: 650;
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(180deg, var(--accent), #5460d8);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 18px -10px #6d7cffcc, inset 0 1px 0 #ffffff33;
      transition: filter 0.15s ease, transform 0.1s ease;
    }

    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: wait; }

    button.secondary {
      background: #1b2236;
      box-shadow: inset 0 0 0 1px #ffffff14;
    }

    #status {
      flex: 0 0 auto;
      margin: -2px 0 0;
      min-height: 1em;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .save-indicator {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(8px + env(safe-area-inset-left, 0px));
      z-index: 30;
      max-width: min(70vw, 260px);
      padding: 5px 10px;
      border: 1px solid #ffffff1f;
      border-radius: 999px;
      background: #0d101ae8;
      color: #dfe4ff;
      font-size: 0.68rem;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .save-indicator.show {
      opacity: 1;
      transform: translateY(0);
    }

    .save-indicator.erro {
      border-color: #ff8f9f55;
      color: #ffc2ca;
    }

    .gba-console {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid #ffffff12;
      border-radius: 18px;
      background: linear-gradient(180deg, #121524, #0b0d16);
      box-shadow: 0 26px 60px -32px #000;
    }

    .gba-screen-frame {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      padding: 6px;
      border: 1px solid #ffffff10;
      border-radius: 12px;
      background: #04050a;
      box-shadow: inset 0 0 30px #000;
    }

    .screen-label {
      position: absolute;
      top: 7px;
      left: 0;
      right: 0;
      z-index: 1;
      margin: 0;
      color: #596080;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-align: center;
      text-transform: uppercase;
      pointer-events: none;
    }

    #game {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    #game .ejs_canvas_parent {
      position: absolute !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #game canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      margin: auto;
      object-fit: contain;
    }

    #game:empty::after {
      content: "Escolha um jogo para começar";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      color: #3f4763;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
      background:
        radial-gradient(420px 220px at 50% 42%, #141a2e, transparent 72%),
        repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 4px);
    }

    #game .ejs_virtualGamepad_parent { display: none !important; }
    #game .ejs_menu_bar,
    #game .ejs_virtualGamepad_open {
      display: none !important;
    }

    .gba-controls {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: minmax(84px, auto) minmax(64px, 1fr) minmax(116px, auto);
      grid-template-areas:
        "shoulders shoulders shoulders"
        "dpad system actions"
        "extras extras extras";
      align-items: center;
      gap: 4px 10px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .gba-controls.has-cpad {
      grid-template-columns: minmax(80px, auto) minmax(52px, 0.5fr) minmax(148px, auto);
    }

    .gba-controls.has-stick {
      grid-template-columns: minmax(96px, auto) minmax(52px, 0.5fr) minmax(132px, auto);
    }

    .gba-shoulders {
      grid-area: shoulders;
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }

    .gba-left {
      grid-area: dpad;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
    }

    .gba-stick {
      position: relative;
      width: clamp(84px, 14vh, 108px);
      height: clamp(84px, 14vh, 108px);
      flex: 0 0 auto;
      border: 1px solid #ffffff1f;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #303956, #121626 68%),
        #121626;
      box-shadow: inset 0 0 0 5px #ffffff08, 0 8px 18px -12px #000;
      touch-action: none;
    }

    .gba-stick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background: linear-gradient(180deg, #7f8cff, #3e49b8);
      box-shadow: 0 4px 10px -4px #000, inset 0 1px 0 #ffffff40;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .gba-stick[aria-disabled="true"] { opacity: 0.5; }

    .gba-dpad {
      display: grid;
      grid-template-columns: repeat(3, clamp(28px, 4.4vh, 44px));
      grid-template-rows: repeat(3, clamp(28px, 4.4vh, 44px));
      gap: 3px;
      justify-content: center;
      touch-action: none;
    }

    .gba-dpad [data-dir="4"] { grid-area: 1 / 2; }
    .gba-dpad [data-dir="6"] { grid-area: 2 / 1; }
    .gba-dpad [data-dir="7"] { grid-area: 2 / 3; }
    .gba-dpad [data-dir="5"] { grid-area: 3 / 2; }

    #controls[aria-disabled="true"] #dpad { opacity: 0.5; }

    .gba-control {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid #ffffff1c;
      border-radius: 10px;
      background: linear-gradient(180deg, #29304a, #171c2d);
      box-shadow: inset 0 1px 0 #ffffff1a, 0 5px 10px -7px #000;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 750;
      line-height: 1;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: filter 0.1s ease, transform 0.08s ease;
    }

    .gba-control:disabled { opacity: 0.45; cursor: not-allowed; }
    .gba-control.is-pressed {
      filter: brightness(1.45);
      transform: translateY(1px);
      box-shadow: inset 0 2px 6px #0009;
    }

    .gba-shoulder {
      width: clamp(52px, 8vh, 66px);
      height: clamp(24px, 3.6vh, 30px);
      border-radius: 999px;
      font-size: 0.72rem;
    }

    .gba-system {
      grid-area: system;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .gba-system .gba-control {
      width: clamp(52px, 8vh, 62px);
      height: clamp(24px, 3.6vh, 30px);
      border-radius: 999px;
      font-size: 0.56rem;
      letter-spacing: 0.05em;
    }

    .gba-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .action-face {
      display: grid;
      grid-template-columns: repeat(var(--cols, 2), clamp(44px, 7vh, 58px));
      gap: 8px;
      justify-content: end;
    }

    .action-face .gba-action {
      width: clamp(44px, 7vh, 58px);
      height: clamp(44px, 7vh, 58px);
      border-radius: 999px;
      font-size: 1rem;
    }

    .gba-action[data-input="8"] {
      background: linear-gradient(180deg, #ff8fb8, #c8446f);
      border-color: #ffc0d5;
    }

    .gba-action[data-input="0"] {
      background: linear-gradient(180deg, #8ea6ff, #4659c4);
      border-color: #c3ceff;
    }

    .gba-cpad {
      display: grid;
      grid-template-columns: repeat(3, clamp(24px, 3.6vh, 32px));
      grid-template-rows: repeat(3, clamp(24px, 3.6vh, 32px));
      gap: 2px;
      justify-content: center;
    }

    .gba-cpad [data-input="23"] { grid-area: 1 / 2; }
    .gba-cpad [data-input="21"] { grid-area: 2 / 1; }
    .gba-cpad [data-input="20"] { grid-area: 2 / 3; }
    .gba-cpad [data-input="22"] { grid-area: 3 / 2; }
    .gba-cpad .gba-control { border-radius: 8px; font-size: 0.62rem; }

    .control-hint {
      grid-area: extras;
      margin: 0;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
    }

    .floating-restart {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      height: 30px;
      padding: 0 11px;
      font-size: 0.7rem;
      background: #1b2236;
      box-shadow: inset 0 0 0 1px #ffffff14;
      opacity: 0.9;
    }

    body.jogando .app-header,
    body.jogando .panel,
    body.jogando #status { display: none; }

    body.jogando .floating-restart {
      position: static;
      order: -1;
      align-self: center;
      height: 28px;
      padding: 0 12px;
      margin: 0;
      opacity: 0.95;
    }

    body.jogando main { padding: 6px 0; gap: 0; }
    body.jogando .gba-console { border-radius: 14px; }

    [hidden] { display: none !important; }

    @media (max-width: 700px) and (orientation: portrait) {
      body.jogando main {
        justify-content: center;
        padding: 4px 0;
      }
      body.jogando .gba-console {
        flex: 0 0 auto;
        padding: 6px;
        gap: 6px;
      }
      body.jogando .gba-screen-frame {
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: var(--screen-aspect, 3 / 2);
      }
      .gba-controls { gap: 4px 6px; }
      .gba-controls.has-cpad .gba-actions {
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .gba-shoulder { width: clamp(46px, 13vw, 58px); }
      .gba-stick {
        width: clamp(78px, 13vh, 100px);
        height: clamp(78px, 13vh, 100px);
      }
      .control-hint { display: none; }
    }

    @media (max-width: 700px) {
      main { width: min(100% - 14px, 900px); padding: 9px 0; gap: 8px; }
      .panel { grid-template-columns: 1fr 1fr; padding: 8px; }
      .panel-actions { grid-column: 1 / -1; }
      .panel-actions button { flex: 1 1 auto; }
      .gba-console { padding: 8px; border-radius: 15px; }
      .gba-screen-frame { padding: 4px; border-radius: 10px; }
    }

    @media (max-width: 460px) {
      .panel { grid-template-columns: 1fr; }
      .panel-actions { grid-column: 1 / -1; }
    }

    @media (max-height: 460px) {
      body { overflow-y: auto; }
      main { height: auto; min-height: 100dvh; }
      .gba-console { min-height: 300px; }
    }

    @media (max-height: 560px) {
      main { padding: 6px 0; gap: 6px; }
      .subtitle, .screen-label, .control-hint { display: none; }
      .panel { padding: 7px; }
      button, .panel-actions button { height: 34px; }
      select { height: 34px; }
      .gba-console { padding: 7px; border-radius: 14px; }
      .gba-controls { grid-template-areas: "shoulders shoulders shoulders" "dpad system actions"; }
      #status { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1>
          <svg class="brand-logo" viewBox="0 0 48 48" role="img" aria-label="GG Retro">
            <defs>
              <linearGradient id="gg-logo-gradient" x1="4" y1="2" x2="44" y2="46" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c8cff" />
                <stop offset="1" stop-color="#b16bff" />
              </linearGradient>
            </defs>
            <rect width="48" height="48" rx="14" fill="url(#gg-logo-gradient)" />
            <text x="24" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="-1.5" fill="#ffffff">GG</text>
            <circle cx="37" cy="11" r="2.5" fill="#ffffff" opacity="0.85" />
          </svg>
          <span class="brand-name">GG <em>Retro</em></span>
        </h1>
        <p class="subtitle">Escolha o console e o jogo — GBA, SNES, Mega Drive e mais.</p>
      </div>
      <span class="badge" id="game-count">Carregando…</span>
    </header>
    <section class="panel" id="setup">
      <div class="field">
        <label for="system">Sistema</label>
        <select id="system" disabled>
          <option value="">Carregando sistemas…</option>
        </select>
      </div>
      <div class="field">
        <label for="rom">Jogo</label>
        <select id="rom" disabled>
          <option value="">Escolha um sistema primeiro…</option>
        </select>
      </div>
      <div class="panel-actions">
        <button id="start" type="button" disabled>Iniciar jogo</button>
        <button id="restart" type="button" class="secondary" hidden>Trocar jogo</button>
      </div>
    </section>
    <p id="status" role="status">Conectando à Activity do Discord…</p>
    <div id="save-indicator" class="save-indicator" role="status" hidden></div>
    <section class="gba-console" aria-label="Console retro">
      <button id="restart-game" class="floating-restart" type="button" hidden>Trocar jogo</button>
      <div class="gba-screen-frame">
        <p class="screen-label">Tela do jogo</p>
        <div id="game" aria-label="Tela do emulador"></div>
      </div>
      <div class="gba-controls" id="controls" aria-label="Controles do jogo" aria-disabled="true">
        <div class="gba-shoulders" id="shoulders"></div>
        <div class="gba-left">
          <div class="gba-stick" id="stick" role="group" aria-label="Analógico" hidden>
            <span class="gba-stick-knob" id="stick-knob"></span>
          </div>
          <div class="gba-dpad" id="dpad" role="group" aria-label="Direcional">
            <button class="gba-control" type="button" data-dir="4" aria-label="Cima" tabindex="-1">▲</button>
            <button class="gba-control" type="button" data-dir="6" aria-label="Esquerda" tabindex="-1">◀</button>
            <button class="gba-control" type="button" data-dir="7" aria-label="Direita" tabindex="-1">▶</button>
            <button class="gba-control" type="button" data-dir="5" aria-label="Baixo" tabindex="-1">▼</button>
          </div>
        </div>
        <div class="gba-system" id="system-buttons"></div>
        <div class="gba-actions" id="actions" aria-label="Botões de ação"></div>
        <p class="control-hint" id="control-hint">Inicie um jogo para ativar os controles.</p>
      </div>
    </section>
  </main>

  <script type="module">
    const DISCORD_CLIENT_ID = __DISCORD_CLIENT_ID_JSON__;
    const SAVE_API_URL = __SAVE_API_URL_JSON__;
    const EJS_DATA_PATH = __EJS_DATA_PATH_JSON__;
    const DISCORD_SDK_MODULE_URL = __DISCORD_SDK_MODULE_URL_JSON__;
    const systemInput = document.querySelector("#system");
    const romInput = document.querySelector("#rom");
    const startButton = document.querySelector("#start");
    const restartButton = document.querySelector("#restart");
    const restartGameButton = document.querySelector("#restart-game");
    const status = document.querySelector("#status");
    const saveIndicator = document.querySelector("#save-indicator");
    const game = document.querySelector("#game");
    const controls = document.querySelector("#controls");
    const controlHint = document.querySelector("#control-hint");
    let discordReady = false;
    let previewMode = false;
    let systems = [];
    let roms = [];
    let resizeScheduled = false;
    let emulatorReady = false;
    let falhaTimer = null;
    let sessaoJogo = 0;
    let webglSuporte = null;
    let discordSdk = null;
    let jogadorId = null;
    let tokenAcesso = null;
    let jogadorProntoResolver = null;
    const jogadorPronto = new Promise((resolve) => {
      jogadorProntoResolver = resolve;
    });
    let jogoAtual = null;
    let autosaveTimer = null;
    let salvando = false;
    let avisoSaveTimer = null;
    const activePointers = new Map();
    const dpad = document.querySelector("#dpad");
    const stick = document.querySelector("#stick");
    const stickKnob = document.querySelector("#stick-knob");
    const dpadAtivos = new Set();
    const teclasAtivas = new Set();
    let stickPointer = null;
    let esquemaAtual = "default";

    // Layouts por control scheme do EmulatorJS (RetroPad): 0=B, 1=Y, 2=Select,
    // 3=Start, 4..7=direcional, 8=A, 9=X, 10=L, 11=R, 12=L2, 13=R2, 20..23=C-pad.
    const LAYOUTS = {
      gba: {
        shoulders: [["L", 10], ["R", 11]],
        face: [["B", 0], ["A", 8]],
        system: [["SELECT", 2], ["START", 3]],
      },
      gb: {
        shoulders: [],
        face: [["B", 0], ["A", 8]],
        system: [["SELECT", 2], ["START", 3]],
      },
      nes: {
        shoulders: [],
        face: [["B", 0], ["A", 8]],
        system: [["SELECT", 2], ["START", 3]],
      },
      snes: {
        shoulders: [["L", 10], ["R", 11]],
        face: [["Y", 1], ["B", 0], ["X", 9], ["A", 8]],
        system: [["SELECT", 2], ["START", 3]],
      },
      n64: {
        shoulders: [["L", 10], ["Z", 12], ["R", 11]],
        face: [["B", 1], ["A", 0]],
        system: [["START", 3]],
        cpad: [["C▲", 23], ["C◀", 21], ["C▶", 20], ["C▼", 22]],
        stick: true,
      },
      psx: {
        shoulders: [["L1", 10], ["R1", 11], ["L2", 12], ["R2", 13]],

    function suporteWebgl() {
      if (webglSuporte !== null) return webglSuporte;
      try {
        // Canvases separados: pedir webgl no mesmo canvas depois de um webgl2
        // que falhou retorna null e dava falso negativo no Discord.
        const canvas2 = document.createElement("canvas");
        if (canvas2.getContext("webgl2", { failIfMajorPerformanceCaveat: false })) {
          webglSuporte = 2;
          return webglSuporte;
        }
        const canvas1 = document.createElement("canvas");
        if (canvas1.getContext("webgl", { failIfMajorPerformanceCaveat: false })) {
          webglSuporte = 1;
          return webglSuporte;
        }
      } catch {
        // sem WebGL
      }
      webglSuporte = 0;
      return webglSuporte;
    }

    function liberarContextosWebgl() {
      document.querySelectorAll("canvas").forEach((canvas) => {
        for (const tipo of ["webgl2", "webgl"]) {
          try {
            const gl = canvas.getContext(tipo);
            gl?.getExtension("WEBGL_lose_context")?.loseContext();
          } catch {}
        }
      });
    }

    function enviarValor(input, value) {
      const emulator = window.EJS_emulator;
      if (!emulatorReady || !emulator?.gameManager) return;
      emulator.gameManager.simulateInput(0, input, value);
    }

    function enviarEntrada(input, pressed) {
      enviarValor(input, pressed ? 1 : 0);

    function enviarAnalog(x, y) {
      const emulator = window.EJS_emulator;
      if (!emulatorReady || !emulator?.gameManager) return;
      // No RetroPad, 16/17 são os eixos do analógico esquerdo.
      emulator.gameManager.simulateInput(0, 16, Math.round(x * 0x7fff));
      emulator.gameManager.simulateInput(0, 17, Math.round(y * 0x7fff));
    }

    function apiUrl(path) {
      return `${SAVE_API_URL}${path}`;

    function bytesParaBase64(bytes) {
      const dados = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      let binario = "";
      for (let i = 0; i < dados.length; i += 0x8000) {
        binario += String.fromCharCode(...dados.subarray(i, i + 0x8000));
      }
      return btoa(binario);
    }

    function base64ParaBytes(texto) {
      const binario = atob(texto);
      const dados = new Uint8Array(binario.length);
      for (let i = 0; i < binario.length; i += 1) dados[i] = binario.charCodeAt(i);
      return dados;
    }

    let savesDbPromise = null;

    function abrirSavesDb() {
      if (!("indexedDB" in window)) return Promise.resolve(null);
      if (savesDbPromise) return savesDbPromise;
      savesDbPromise = new Promise((resolve, reject) => {
        const requisicao = indexedDB.open("ejs-cloud-saves", 1);
        requisicao.onupgradeneeded = () => {
          const db = requisicao.result;
          if (!db.objectStoreNames.contains("saves")) {
            db.createObjectStore("saves", { keyPath: "key" });
          }
        };
        requisicao.onsuccess = () => resolve(requisicao.result);
        requisicao.onerror = () => reject(requisicao.error);
      });
      return savesDbPromise;
    }

    function chaveSaveLocal(chave) {
      return `${jogadorId || "convidado"}:${chave}`;
    }

    async function salvarLocal(chave, dados) {
      const db = await abrirSavesDb();
      if (!db) return;
      await new Promise((resolve, reject) => {
        const transacao = db.transaction("saves", "readwrite");
        transacao.objectStore("saves").put({
          key: chaveSaveLocal(chave),
          state: dados.state || null,
          sram: dados.sram || null,
          updatedAt: Date.now(),
        });
        transacao.oncomplete = () => resolve();
        transacao.onerror = () => reject(transacao.error);
      });
    }

    async function carregarLocal(chave) {
      const db = await abrirSavesDb();
      if (!db) return null;
      return new Promise((resolve, reject) => {
        const transacao = db.transaction("saves", "readonly");
        const requisicao = transacao.objectStore("saves").get(chaveSaveLocal(chave));
        requisicao.onsuccess = () => resolve(requisicao.result || null);
        requisicao.onerror = () => reject(requisicao.error);
      });
    }

    function capturarSave() {
      const emulator = window.EJS_emulator;
      const gm = emulator?.gameManager;
      if (!gm || !jogoAtual) return null;

      let state = null;
      let sram = null;
      try {
        if (gm.supportsStates?.() !== false) {
          const dados = gm.getState();
          if (dados?.length) state = bytesParaBase64(dados);
        }
      } catch (erro) {
        console.warn("Não foi possível capturar o save state:", erro);
      }
      try {
        gm.saveSaveFiles?.();
        const dados = gm.getSaveFile(false);
        if (dados?.length) sram = bytesParaBase64(dados);
      } catch (erro) {
        console.warn("Não foi possível capturar o SRAM:", erro);
      }
      if (!state && !sram) return null;
      return { state, sram };
    }

    function aplicarSave(dados) {
      const emulator = window.EJS_emulator;
      const gm = emulator?.gameManager;
      if (!gm || !dados) return false;

      try {
        if (dados.sram) {
          const caminho = gm.getSaveFilePath?.();
          if (caminho) gm.FS.writeFile(caminho, base64ParaBytes(dados.sram));
          gm.loadSaveFiles?.();
        }
      } catch (erro) {
        console.warn("Não foi possível aplicar o SRAM:", erro);
      }
      try {
        if (dados.state && gm.supportsStates?.() !== false) {
          gm.loadState(base64ParaBytes(dados.state));
        }
      } catch (erro) {
        console.warn("Não foi possível aplicar o save state:", erro);
        return false;
      }
      return true;
    }

    async function carregarSave(chave) {
      let dados = null;
      let origem = null;
      if (jogadorId && tokenAcesso) {
        try {
          const resposta = await fetch(
            apiUrl(`/api/emu/saves/${encodeURIComponent(chave)}`),
            {
              headers: { Authorization: `Bearer ${tokenAcesso}` },
              cache: "no-store",
            },
          );
          if (resposta.ok) {
            dados = await resposta.json();
            origem = "nuvem";
          }
        } catch (erro) {
          console.warn("Save na nuvem indisponível, usando o local:", erro);
        }
      }
      if (!dados) {
        try {
          dados = await carregarLocal(chave);
          if (dados) origem = "local";
        } catch (erro) {
          console.warn("Save local indisponível:", erro);
        }
      }
      if (!dados) return null;
      return aplicarSave(dados) ? origem : null;
    }

    function mostrarAvisoSave(texto, erro = false) {
      clearTimeout(avisoSaveTimer);
      saveIndicator.textContent = texto;
      saveIndicator.classList.toggle("erro", erro);
      saveIndicator.hidden = false;
      requestAnimationFrame(() => saveIndicator.classList.add("show"));
      avisoSaveTimer = setTimeout(() => {
        saveIndicator.classList.remove("show");
        setTimeout(() => {
          saveIndicator.hidden = true;
        }, 250);
      }, 2600);
    }

    async function salvarAgora(keepalive = false) {
      if (!jogoAtual || salvando) return;
      const dados = capturarSave();
      if (!dados) return;
      const chave = jogoAtual.chave;
      salvando = true;
      try {
        await salvarLocal(chave, dados);
        if (jogadorId && tokenAcesso) {
          const resposta = await fetch(
            apiUrl(`/api/emu/saves/${encodeURIComponent(chave)}`),
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${tokenAcesso}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(dados),
              keepalive,
            },
          );
          if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
          mostrarAvisoSave("☁️ Save salvo");
        } else {
          mostrarAvisoSave("💾 Save local");
        }
      } catch (erro) {
        console.warn("Falha ao salvar na nuvem:", erro);
        mostrarAvisoSave("⚠️ Save só neste dispositivo", true);
      } finally {
        salvando = false;
      }
    }

    function iniciarAutosave() {
      pararAutosave();
      autosaveTimer = setInterval(() => salvarAgora(false), 20000);
    }

    function pararAutosave() {
      clearInterval(autosaveTimer);
      autosaveTimer = null;
    }

    async function autenticarDiscord(sdk) {
      if (!SAVE_API_URL && window.parent === window) return null;
      try {
        const { code } = await sdk.commands.authorize({
          client_id: DISCORD_CLIENT_ID,
          response_type: "code",
          state: "",
          prompt: "none",
          scope: ["identify"],
        });
        const resposta = await fetch(apiUrl("/api/emu/token"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        if (!resposta.ok) throw new Error(`Token HTTP ${resposta.status}`);
        const { access_token: accessToken } = await resposta.json();
        if (!accessToken) throw new Error("Token vazio");
        const auth = await sdk.commands.authenticate({
          access_token: accessToken,
        });
        tokenAcesso = accessToken;
        jogadorId = auth.user.id;
        return jogadorId;
      } catch (erro) {
        console.warn("OAuth do save na nuvem falhou:", erro);
        try {
          const { participants } =
            await sdk.commands.getActivityInstanceConnectedParticipants();
          if (participants?.length === 1) jogadorId = participants[0].id;
        } catch {}
        return jogadorId;
      }
    }

    function soltarPonteiro(pointerId) {
      if (!activePointers.has(pointerId)) return;
      const input = activePointers.get(pointerId);
      activePointers.delete(pointerId);
      if (![...activePointers.values()].includes(input)) enviarEntrada(input, false);
      controls
        .querySelector(`[data-input="${input}"]`)
        ?.classList.toggle(
          "is-pressed",
          [...activePointers.values()].includes(input),
        );
    }

    controls.addEventListener("pointerdown", (event) => {
      const button = event.target.closest("[data-input]");
      if (!button || button.disabled) return;
      event.preventDefault();
      const input = Number(button.dataset.input);
      if (activePointers.has(event.pointerId)) soltarPonteiro(event.pointerId);
      if (![...activePointers.values()].includes(input)) enviarEntrada(input, true);
      activePointers.set(event.pointerId, input);
      button.classList.add("is-pressed");
      button.setPointerCapture(event.pointerId);
      if ("vibrate" in navigator) navigator.vibrate(6);
    });

    for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
      controls.addEventListener(eventName, (event) => soltarPonteiro(event.pointerId));
    }

    let dpadPointer = null;

    function direcoesDoPonto(x, y) {
      const rect = dpad.getBoundingClientRect();
      const dx = x - (rect.left + rect.width / 2);
      const dy = y - (rect.top + rect.height / 2);
      const margem = Math.min(rect.width, rect.height) * 0.12;
      const ativos = new Set();
      if (Math.abs(dx) > margem) ativos.add(dx < 0 ? 6 : 7);
      if (Math.abs(dy) > margem) ativos.add(dy < 0 ? 4 : 5);
      return ativos;
    }

    function aplicarDpad(ativos) {
      for (const input of [4, 5, 6, 7]) {
        const ativo = ativos.has(input);
        if (dpadAtivos.has(input) === ativo) continue;
        enviarEntrada(input, ativo);
        if (ativo) dpadAtivos.add(input);
        else dpadAtivos.delete(input);
        dpad
          .querySelector(`[data-dir="${input}"]`)
          ?.classList.toggle("is-pressed", ativo);
      }
    }

    dpad.addEventListener("pointerdown", (event) => {
      if (!emulatorReady) return;
      event.preventDefault();
      dpadPointer = event.pointerId;
      dpad.setPointerCapture(event.pointerId);
      aplicarDpad(direcoesDoPonto(event.clientX, event.clientY));
    });

    dpad.addEventListener("pointermove", (event) => {
      if (event.pointerId !== dpadPointer) return;
      aplicarDpad(direcoesDoPonto(event.clientX, event.clientY));
    });

    for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
      dpad.addEventListener(eventName, (event) => {
        if (event.pointerId !== dpadPointer) return;
        dpadPointer = null;
        aplicarDpad(new Set());
      });
    }

    function soltarStick() {
      if (stickPointer === null) return;
      stickPointer = null;
      stickKnob.style.transform = "translate(-50%, -50%)";
      enviarAnalog(0, 0);
    }

    function atualizarStick(event) {
      const rect = stick.getBoundingClientRect();
      const raio = Math.min(rect.width, rect.height) / 2;
      if (raio <= 0) return;

      let dx = (event.clientX - (rect.left + rect.width / 2)) / raio;
      let dy = (event.clientY - (rect.top + rect.height / 2)) / raio;
      const distancia = Math.hypot(dx, dy);
      if (distancia > 1) {
        dx /= distancia;
        dy /= distancia;
      }
      if (Math.hypot(dx, dy) < 0.14) {
        dx = 0;
        dy = 0;
      }

      const limite = raio * 0.36;
      stickKnob.style.transform =
        `translate(calc(-50% + ${dx * limite}px), calc(-50% + ${dy * limite}px))`;
      enviarAnalog(dx, dy);
    }

    stick.addEventListener("pointerdown", (event) => {
      if (stick.hidden || !emulatorReady) return;
      event.preventDefault();
      stickPointer = event.pointerId;
      stick.setPointerCapture(event.pointerId);
      atualizarStick(event);
    });

    stick.addEventListener("pointermove", (event) => {
      if (event.pointerId !== stickPointer) return;
      event.preventDefault();
      atualizarStick(event);
    });

    for (const eventName of ["pointerup", "pointercancel", "lostpointercapture"]) {
      stick.addEventListener(eventName, (event) => {
        if (event.pointerId !== stickPointer) return;
        soltarStick();
      });
    }

    const TECLAS = {
      ArrowUp: [4],
      ArrowDown: [5],
      ArrowLeft: [6],
      ArrowRight: [7],
      z: [0],
      x: [8],
      a: [1],
      s: [9],
      q: [10],
      e: [11],
      Enter: [3],
      Shift: [2],
    };

    document.addEventListener("keydown", (event) => {
      if (event.target.closest?.("input, select, textarea")) return;
      const inputs = TECLAS[event.key];
      if (!inputs) return;
      // Impede que as setas rolem a página mesmo antes do jogo iniciar.
      event.preventDefault();
      if (!emulatorReady || event.repeat) return;
      for (const input of inputs) {
        enviarEntrada(input, true);
        teclasAtivas.add(input);
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.target.closest?.("input, select, textarea")) return;
      const inputs = TECLAS[event.key];
      if (!inputs) return;
      event.preventDefault();
      for (const input of inputs) {
        enviarEntrada(input, false);
        teclasAtivas.delete(input);
      }
    });

    function soltarTodosOsControles() {
      for (const pointerId of [...activePointers.keys()]) soltarPonteiro(pointerId);
      aplicarDpad(new Set());
      soltarStick();
      for (const input of [...teclasAtivas]) enviarEntrada(input, false);
      teclasAtivas.clear();
    }

    window.addEventListener("blur", soltarTodosOsControles);

    function atualizarBotao() {
      startButton.disabled = romInput.disabled || !romInput.value;
    }

    function atualizarStatusDaSelecao() {
      if (!discordReady) {
        status.textContent = "Conectando à Activity do Discord…";
        return;
      }

      const system = systems.find((item) => item.id === systemInput.value);
      if (!system) {
        status.textContent = previewMode
          ? "Prévia no navegador. Escolha um sistema."
          : "Conectado. Escolha um sistema.";
        return;
      }

      const jogosDoSistema = roms.filter((rom) => rom.core === system.id);
      if (jogosDoSistema.length === 0) {
        status.textContent =
          `Ainda não há jogos para ${system.name}. Adicione uma ROM compatível ` +
          `à pasta rom/${system.id}/ no GitHub.`;
        return;
      }

      status.textContent = previewMode
        ? "Prévia no navegador. Escolha um jogo para iniciar."
        : "Conectado. Escolha um jogo para iniciar.";
    }

    function atualizarListaDeJogos() {
      const system = systems.find((item) => item.id === systemInput.value);
      const jogosDoSistema = roms.filter((rom) => rom.core === system?.id);
      romInput.replaceChildren(
        new Option(
          jogosDoSistema.length ? "Selecione um jogo…" : "Nenhum jogo disponível",
          "",
        ),
      );
      for (const rom of jogosDoSistema) {
        romInput.add(new Option(rom.name, rom.url));
      }

      romInput.disabled = jogosDoSistema.length === 0;
      renderControles(esquemaDoCore(system?.id ?? "default"));
      atualizarStatusDaSelecao();
      atualizarBotao();
    }

    function atualizarTamanhoEmulador() {
      if (resizeScheduled) return;
      resizeScheduled = true;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resizeScheduled = false;
          if (game.clientWidth === 0 || game.clientHeight === 0) return;
          window.EJS_emulator?.frontend?.handleResize?.();
        });
      });

    async function carregarRoms() {
      try {
        const versao = Date.now();
        const [systemsResponse, romsResponse] = await Promise.all([
          fetch(`./systems.json?v=${versao}`, { cache: "no-store" }),
          fetch(`./roms.json?v=${versao}`, { cache: "no-store" }),
        ]);
        if (!systemsResponse.ok || !romsResponse.ok) {
          throw new Error(
            `Falha ao carregar os catálogos (${systemsResponse.status}, ${romsResponse.status}).`,
          );
        }

        const [systemCatalog, gameCatalog] = await Promise.all([
          systemsResponse.json(),
          romsResponse.json(),
        ]);
        if (
          !Array.isArray(systemCatalog) ||
          systemCatalog.length === 0 ||
          systemCatalog.some(
            (system) =>
              typeof system.id !== "string" ||
              typeof system.name !== "string" ||
              !Array.isArray(system.extensions),
          ) ||
          !Array.isArray(gameCatalog.games)
        ) {
          throw new Error("Os catálogos de sistemas ou jogos têm formato inválido.");
        }

        systems = systemCatalog;
        roms = gameCatalog.games;
        const systemIds = new Set(systemCatalog.map((system) => system.id));
        if (
          roms.some(
            (rom) =>
              typeof rom.name !== "string" ||
              typeof rom.url !== "string" ||
              !systemIds.has(rom.core),
          )
        ) {
          throw new Error("O catálogo contém jogos associados a sistemas inválidos.");
        }

        const comJogos = new Set(roms.map((rom) => rom.core));
        systems = systemCatalog.filter((system) => comJogos.has(system.id));
        if (systems.length === 0) {
          throw new Error("Nenhum sistema possui jogos no repositório.");
        }

        document.querySelector("#game-count").textContent =
          `${roms.length} ${roms.length === 1 ? "jogo" : "jogos"}`;

        systemInput.replaceChildren();
        for (const system of systems) {
          systemInput.add(new Option(system.name, system.id));
        }
        systemInput.value = systems.some((system) => system.id === "mgba")
          ? "mgba"
          : systems[0].id;
        systemInput.disabled = false;
        atualizarListaDeJogos();
      } catch (error) {
        status.textContent = "Não foi possível carregar os sistemas e jogos.";
        console.error("Failed to load the EmulatorJS catalogs:", error);
      }
    }

    async function connectToDiscord() {
      // A UI não depende do SDK do Discord; o handshake roda em background.
      discordReady = true;

      if (window.parent === window) {
        previewMode = true;
        jogadorProntoResolver?.(null);
        jogadorProntoResolver = null;
        atualizarStatusDaSelecao();
        atualizarBotao();
        return;
      }

      atualizarStatusDaSelecao();
      atualizarBotao();

      try {
        const { DiscordSDK } = await import(DISCORD_SDK_MODULE_URL);
        discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
        await Promise.race([
          discordSdk.ready(),
          new Promise((resolve) => setTimeout(resolve, 2500)),
        ]);
        await autenticarDiscord(discordSdk);
      } catch (error) {
        console.error("Discord Activity SDK failed to initialize:", error);
      } finally {
        jogadorProntoResolver?.(jogadorId);
        jogadorProntoResolver = null;
      }
    }

    systemInput.addEventListener("change", atualizarListaDeJogos);
    romInput.addEventListener("change", atualizarBotao);
    restartButton.addEventListener("click", trocarJogo);
    restartGameButton.addEventListener("click", trocarJogo);

    function trocarJogo() {
      // No Discord, recarregar o iframe nem sempre funciona; encerramos o
      // emulador atual e voltamos para a seleção sem sair da Activity.
      salvarAgora(true);
      pararAutosave();
      jogoAtual = null;
      sessaoJogo += 1;
      const emulator = window.EJS_emulator;
      try {
        emulator?.pause?.(true);
      } catch {}
      try {
        emulator?.gameManager?.toggleMainLoop?.(0);
      } catch {}
      try {
        // O resize global ainda chama o emulador antigo; neutraliza para
        // ele não tentar acessar o canvas que foi removido.
        if (emulator) emulator.handleResize = () => {};
        if (emulator?.frontend) emulator.frontend.handleResize = () => {};
      } catch {}

      liberarContextosWebgl();
      soltarTodosOsControles();
      clearTimeout(falhaTimer);
      window.EJS_emulator = null;
      window.EJS_adBlocked = null;
      emulatorReady = false;
      game.replaceChildren();
      document
        .querySelectorAll("script[data-ejs-loader]")
        .forEach((script) => script.remove());

      document.body.classList.remove("jogando");
      document.querySelector(".screen-label").hidden = false;
      restartButton.hidden = true;
      restartGameButton.hidden = true;
      systemInput.disabled = false;
      romInput.disabled = romInput.options.length <= 1;
      atualizarControles(false);
      status.textContent = "Escolha outro jogo para iniciar.";
      atualizarBotao();
    }

    startButton.addEventListener("click", async () => {
      const rom = roms.find(
        (item) =>
          item.url === romInput.value && item.core === systemInput.value,
      );
      if (!rom) return;

      const sessaoAtual = ++sessaoJogo;
      const coreN64 = ["mupen64plus_next", "parallel_n64"].includes(rom.core);
      const webgl = suporteWebgl();
      if (coreN64 && webgl < 2) {
        // Alguns iframes do Discord escondem o WebGL2 da checagem, mas o
        // EmulatorJS consegue criar o contexto. Tenta iniciar de qualquer
        // forma e deixa o timeout/erro do próprio core decidir.
        console.warn(
          `WebGL detectado: ${webgl}. Tentando iniciar N64 mesmo assim.`,
        );
      }

      startButton.disabled = true;
      restartButton.hidden = false;
      document.querySelector(".screen-label").hidden = true;
      systemInput.disabled = true;
      romInput.disabled = true;
      status.textContent = "Iniciando o emulador…";

      const esquema = esquemaDoCore(rom.core);
      renderControles(esquema);
      jogoAtual = {
        chave: `${rom.core}:${rom.name.replace(/[\\/]/g, "-")}`,
        rom,
      };

      document.body.classList.add("jogando");
      restartGameButton.hidden = false;

      window.EJS_player = "#game";
      window.EJS_gameName = rom.name;
      window.EJS_gameUrl = rom.url;
      window.EJS_core = rom.core;
      window.EJS_controlScheme = esquema;
      window.EJS_pathtodata = EJS_DATA_PATH;
      window.EJS_startOnLoaded = true;
      window.EJS_onGameStart = async () => {
        if (sessaoAtual !== sessaoJogo) return;
        clearTimeout(falhaTimer);
        atualizarControles(true);
        status.textContent = "Jogo iniciado. Use os controles abaixo.";

        await Promise.race([
          jogadorPronto,
          new Promise((resolve) => setTimeout(resolve, 2500)),
        ]);
        if (sessaoAtual !== sessaoJogo || !jogoAtual) return;
        const carregou = await carregarSave(jogoAtual.chave);
        if (sessaoAtual !== sessaoJogo) return;
        if (carregou) {
          status.textContent = "Save carregado. Continue de onde parou.";
          mostrarAvisoSave(
            carregou === "nuvem" ? "☁️ Save carregado" : "💾 Save carregado",
          );
        }
        iniciarAutosave();
      };

      const loader = document.createElement("script");
      loader.dataset.ejsLoader = "true";
      loader.src = `${EJS_DATA_PATH}loader.js`;
      loader.onerror = () => {
        if (sessaoAtual !== sessaoJogo) return;
        status.textContent =
          "Não foi possível carregar o EmulatorJS. Confira sua conexão e tente atualizar.";
        pararAutosave();
        jogoAtual = null;
        document.body.classList.remove("jogando");
        document.querySelector(".screen-label").hidden = false;
        restartButton.hidden = true;
        restartGameButton.hidden = true;
        atualizarControles(false);
        systemInput.disabled = false;
        romInput.disabled = false;
        atualizarBotao();
      };
      document.body.appendChild(loader);

      clearTimeout(falhaTimer);
      falhaTimer = setTimeout(() => {
        if (sessaoAtual !== sessaoJogo) return;
        if (emulatorReady) return;
        status.textContent =
          "O emulador não terminou de iniciar. Verifique o WebGL do navegador e tente de novo.";
        pararAutosave();
        jogoAtual = null;
        document.body.classList.remove("jogando");
        document.querySelector(".screen-label").hidden = false;
        restartButton.hidden = true;
        restartGameButton.hidden = true;
        atualizarControles(false);
        systemInput.disabled = false;
        romInput.disabled = false;
        atualizarBotao();
      }, coreN64 ? 90000 : 30000);
    });

    if ("ResizeObserver" in window) {
      const resizeObserver = new ResizeObserver((entries) => {
        if (entries.some(({ contentRect }) => contentRect.width > 0 && contentRect.height > 0)) {
          atualizarTamanhoEmulador();
        }
      });
      resizeObserver.observe(game);
    } else {
      window.addEventListener("resize", atualizarTamanhoEmulador);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        atualizarTamanhoEmulador();
      } else {
        soltarTodosOsControles();
        salvarAgora(true);
      }
    });
    window.addEventListener("pagehide", () => salvarAgora(true));
    document.addEventListener("fullscreenchange", atualizarTamanhoEmulador);
    window.addEventListener("pageshow", atualizarTamanhoEmulador);

    carregarRoms();
    connectToDiscord();
  </script>
</body>
</html>
